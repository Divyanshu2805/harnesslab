[project]
name = "harnesslab"
version = "0.1.0"
description = "A controlled ablation of agent harnesses against models, on affordable compute."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Divyanshu Agrahari" }]
keywords = ["llm", "agents", "evaluation", "benchmark", "inspect-ai"]

dependencies = [
    # Evaluation framework. Provides Task/Solver/Scorer, the typed per-sample
    # Store, structured .eval logs, and native providers for every model we use.
    "inspect-ai>=0.3.60",
    # Native provider SDKs. Note there is deliberately no litellm here: Inspect
    # covers groq/google/mistral/ollama/openrouter natively and reaches Cerebras
    # through its openai-api/ compatible path. See docs/adr/0001.
    "openai>=1.60.0",          # also serves openai-api/cerebras/* and ollama
    "google-genai>=1.0.0",
    "groq>=0.13.0",
    "mistralai>=1.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    # Analysis. pandas/pyarrow back Inspect's samples_df(); statsmodels carries
    # the confirmatory mixed-effects logistic regression.
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "statsmodels>=0.14.0",
    # Results store. Postgres is the source of truth; SQLite is stdlib.
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pandas-stubs>=2.2.0",
]
viz = [
    # Vector-PDF export for the paper. The web charts are rendered client-side
    # from JSON; this is the second output path of the same chart definition.
    "matplotlib>=3.9.0",
]

[project.scripts]
harnesslab = "harnesslab.cli:app"

[project.urls]
Repository = "https://github.com/USERNAME/harnesslab"
Leaderboard = "https://USERNAME.github.io/harnesslab/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harnesslab"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]
ignore = [
    "E501",     # line length is enforced by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["inspect_ai.*", "statsmodels.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    # Anything touching a real provider. Excluded from `make check` so the
    # default test path makes zero network calls -- see docs/ARCHITECTURE.md.
    "network: requires live provider access (deselected by default)",
    "gpu: requires a local Ollama server with the Lane A models pulled",
    "slow: takes more than ~5 seconds",
]

[tool.coverage.run]
source = ["src/harnesslab"]
branch = true
