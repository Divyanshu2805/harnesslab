name: CI

# Runs on every push and pull request, including from forks.
#
# This job reads NO repository secrets, deliberately. A fork PR cannot access
# them, and a CI that only passes for the maintainer is a CI that stops
# reviewing contributions. The test suite is offline by construction -- the
# `network` and `gpu` markers are deselected -- so no provider key is needed and
# no free-tier quota is spent on a push.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms, because SPEC-002 requires generate_env() to produce
        # byte-identical output on each. A determinism bug that only appears on
        # Linux would otherwise surface in a sweep rather than in review.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Scaffold — spec dependencies, ordering, docs, diagrams
        run: uv run python scripts/verify_scaffold.py

      - name: Docs are in sync with repository state
        run: uv run python scripts/sync_docs.py --check

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Types
        run: uv run mypy src

      - name: Tests (offline — no network, no GPU)
        run: uv run pytest -m "not network and not gpu" -q

  # Proves the offline claim rather than asserting it: the suite must pass with
  # every provider variable explicitly blanked. If a test quietly depended on a
  # developer's .env, this fails.
  offline-guarantee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --frozen
      - name: Tests with all provider keys blanked
        env:
          GROQ_API_KEY: ""
          GOOGLE_API_KEY: ""
          CEREBRAS_API_KEY: ""
          OPENROUTER_API_KEY: ""
          MISTRAL_API_KEY: ""
        run: uv run pytest -m "not network and not gpu" -q
